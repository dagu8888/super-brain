<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super-Brain 3.0 · 指挥中心原型</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../base.css">
<link rel="stylesheet" href="prototype.css">
</head>
<body>

<div class="sb-app">
  <!-- 左侧导航（248px，玻璃） -->
  <aside class="sb-sidebar sb-glass">
    <div class="pt-brand">
      <span class="pt-brand-mark">S</span>
      <div>
        <strong>SUPER-BRAIN</strong>
        <span class="pt-badge">3.0 原型</span>
      </div>
    </div>
    <nav class="pt-nav" id="nav" aria-label="主导航"></nav>
    <div class="pt-side-foot">
      <div class="pt-conn">
        <span class="sb-status" data-status="idle" id="conn-state">演示数据</span>
        <small class="sb-text-tertiary" id="conn-mode">SSE 实时推送 · 只读</small>
      </div>
      <button class="sb-button sb-button-secondary" id="theme-toggle" type="button">切换深 / 浅色</button>
    </div>
  </aside>

  <!-- 主区 -->
  <main class="sb-main">
    <div class="sb-topbar sb-glass">
      <h1 id="page-title">指挥中心</h1>
      <div class="pt-search">
        <input id="global-search" type="search" placeholder="搜索 Agent / 任务 / 事件…（⌘K）" aria-label="全局搜索">
      </div>
      <span class="sb-status" data-status="completed">系统正常</span>
      <button class="pt-demo-pill" id="live-badge" type="button" data-live="0"
              title="点击接入真实数据（只读口令）">演示数据</button>
      <div class="pt-avatar" aria-label="当前用户">古</div>
    </div>
    <div class="sb-content" id="views"></div>
  </main>
</div>

<!-- 右侧详情面板（380px，滑入滑出） -->
<aside class="sb-detail-panel" id="detail" data-open="false" aria-label="详情面板"></aside>

<script src="../vendor/three.min.js"></script>
<script src="scene3d.js?v=3"></script>
<script src="data.js"></script>
<script src="prototype.js?v=9"></script>
<script src="live.js?v=3"></script>
</body>
</html>
